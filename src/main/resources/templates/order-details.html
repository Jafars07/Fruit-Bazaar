<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Order Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
          <link rel="stylesheet" href="/css/cart.css">
          <link rel="stylesheet" href="/css/order-details.css">

</head>

<body>
<div id="adminBackButton" style="display:none;">
    <div class="container py-3">

        <a href="/admin-orders" class="back-btn">
            <i class="bi bi-arrow-left"></i>
            Back To Orders
        </a>

    </div>
</div>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand logo" href="/">
            🥥 <span class="logo-f">F</span>ruit Bazaar 🍓
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navBar">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navBar">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/products">Products</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/cart">Cart</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="/my-orders">My Orders</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-warning"
                       href="#"
                       onclick="logout()">
                       Logout
                    </a>
                </li>

            </ul>

        </div>

    </div>
</nav>

<div class="container py-4">

    <!-- TITLE -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="page-title">
            <i class="bi bi-receipt"></i>
            Order Details
        </h2>

        <!-- <button class="btn btn-outline-secondary back-btn"
                onclick="goBack()">

            <i class="bi bi-arrow-left"></i>
            Back

        </button> -->

    </div>
<strong id="orderId"></strong>

<div class="summary-card mb-4" id="orderInfo">

</div>
    <!-- ORDER ITEMS -->
    <div id="orderItems" class="row g-4"></div>

    <!-- TOTAL -->
    <div class="summary-card mt-4">

        <div class="d-flex justify-content-between align-items-center">

            <h4 class="mb-0">
                Total Amount
            </h4>

            <h3 class="price mb-0">
                ₹<span id="orderTotal">0</span>
            </h3>

        </div>

    </div>

</div>

<!-- TOAST -->
<div class="toast-container position-fixed top-0 end-0 p-3"
     style="z-index: 9999">

    <div id="liveToast"
         class="toast align-items-center text-white bg-success border-0"
         role="alert">

        <div class="d-flex">

            <div class="toast-body"
                 id="toastMsg">

                Success

            </div>

            <button type="button"
                    class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast">
            </button>

        </div>

    </div>

</div>

<script src="/js/Order-Details.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
