<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Fruit Stall</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
     <link rel="stylesheet" href="/css/auth.css">
     <link rel="stylesheet" href="/css/index.css">
</head>

<body>
<div class="video-bg">
    <video autoplay muted loop playsinline>
        <source src="/images/video.mp4" type="video/mp4">
    </video>
</div>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand logo" href="#">
  🥥 <span class="logo-f">F</span>ruit Bazaar 🍓
</a>
    </div>
</nav>

<!-- AUTH WRAPPER -->
<div class="auth-container">

    <div class="auth-card">

        <h3>🍎 Register</h3>
        <div class="progress-steps">

    <div class="step active" id="step1">
        <div class="step-circle">1</div>
        <span>Email</span>
    </div>

    <div class="step-line"></div>

    <div class="step" id="step2">
        <div class="step-circle">2</div>
        <span>OTP</span>
    </div>

    <div class="step-line"></div>

    <div class="step" id="step3">
        <div class="step-circle">3</div>
        <span>Password</span>
    </div>

    <div class="step-line"></div>

    <div class="step" id="step4">
        <div class="step-circle">✓</div>
        <span>Done</span>
    </div>

</div>
<form id="registerForm">

    <!-- Email -->
    <div id="emailSection">

    <h5 class="step-title">
        📧 Verify Your Email
    </h5>

    <div class="mb-3">
    <input
        type="email"
        id="username"
        class="form-control"
        placeholder="Enter Email Address"
        required>
</div>
<div id="statusMessage" class="text-center mt-2"></div>
</div>
    <!-- Send OTP Button -->
    <div class="mb-3">
        <button
            type="button"
            id="sendOtpBtn"
            class="btn btn-warning w-100">

            <span id="sendOtpText">Send OTP</span>

            <span
                id="sendOtpLoader"
                class="spinner-border spinner-border-sm ms-2"
                style="display:none;"
                role="status">
            </span>

        </button>
    </div>

    <!-- OTP Section -->
<div id="otpSection" style="display:none;">

    <h5 class="step-title">
        🔐 Enter Verification Code
    </h5>

        <div class="mb-3">

            <input
    type="text"
    id="otp"
    class="form-control text-center">

        </div>

        <button
            type="button"
            id="verifyOtpBtn"
            class="btn btn-info w-100">
            Verify OTP
        </button>

    </div>

    <!-- Password Section -->
<div id="passwordSection" style="display:none;">

    <h5 class="step-title">
        🔒 Create Password
    </h5>

    <!-- Password -->

    <div class="mb-3 mt-3">

        <div class="input-group">

            <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Create Password">

            <span
                class="input-group-text eye-btn"
                onclick="togglePassword('password')">

                <i class="bi bi-eye"></i>

            </span>

        </div>

    </div>

    <!-- Confirm Password -->

    <div class="mb-3">

        <div class="input-group">

            <input
                type="password"
                id="confirmPassword"
                class="form-control"
                placeholder="Confirm Password">

            <span
                class="input-group-text eye-btn"
                onclick="togglePassword('confirmPassword')">

                <i class="bi bi-eye"></i>

            </span>

        </div>

    </div>

    <!-- Register Button -->

    <button
        type="submit"
        class="btn btn-success w-100">

        Register

    </button>

</div>

</form>

        <p id="msg" class="text-center mt-3"></p>

    </div>

</div>
<script src="/js/theme.js"></script>
<script src="/js/register.js"></script>
<script src="/js/toast.js"></script>
</body>
</html>
