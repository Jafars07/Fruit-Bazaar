<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Products - Fruit Bazaar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/products.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand logo" href="/">
            🥥 <span class="logo-f">F</span>ruit Bazaar 🍓
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navBar">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navBar">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link active" href="/products">
                        Products
                    </a>
                </li>

                <li class="nav-item">
    <a class="nav-link" href="/cart">
        🛒 Cart
        <span id="cartCount" class="badge bg-warning text-dark">
            0
        </span>
    </a>
</li>

                <li class="nav-item">
                    <a class="nav-link" href="/my-orders">
                        My Orders
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-warning"
                       href="#"
                       onclick="logout()">
                        Logout
                    </a>
                </li>

            </ul>

        </div>

    </div>
</nav>

<!-- PAGE HEADER -->
<section class="products-header">

    <div class="container">

        <h2>🍎 Fresh Fruits & Coconuts</h2>

        <p>
            Farm Fresh • Premium Quality • Fast Delivery
        </p>

    </div>

</section>

<!-- SEARCH -->
<section class="products-toolbar">

    <div class="container">

        <div class="search-wrapper">

            <input
                type="text"
                id="searchBox"
                class="form-control search-box"
                placeholder="🔍 Search fruits, coconuts, seasonal products..."
                onkeyup="filterProducts()">

        </div>

    </div>

</section>

<!-- PRODUCTS -->
<section class="products-section">

    <div class="container">

        <div class="row g-4" id="productList"></div>

    </div>

</section>

<!-- TOAST -->
<div class="toast-container-custom">

    <div id="liveToast"
         class="toast text-white bg-success border-0">

        <div class="d-flex">

            <div class="toast-body text-center"
                 id="toastMsg">
            </div>

        </div>

    </div>

</div>

<script src="/js/products.js"></script>
<script src="/js/theme.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
