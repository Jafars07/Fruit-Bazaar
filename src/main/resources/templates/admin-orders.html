<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Admin Orders</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- CSS -->
    <link rel="stylesheet" href="/css/admin-orders.css">

</head>

<body>

<!-- NAVBAR -->
<!-- MOBILE BACK BUTTON -->
<div class="mobile-back-btn container">

    <a href="/admin" class="back-btn">
        <i class="bi bi-arrow-left"></i>
        Back To Admin
    </a>

</div>


<!-- CONTENT -->
<div class="container py-4">

    <!-- TITLE -->
    <div class="d-flex justify-content-between
                align-items-center flex-wrap gap-3 mb-4">

        <div>

            <h2 class="fw-bold text-success mb-1">
                Order Management
            </h2>

            <p class="text-muted m-0">
                Manage customer orders and delivery status
            </p>

        </div>

    </div>
    <!-- DASHBOARD -->


<div class="row g-3 mb-4">


    <div class="col-lg-3 col-md-6">
        <div class="dashboard-card">
            <i class="bi bi-bag-check"></i>
            <h4 id="totalOrders">0</h4>
            <p>Total Orders</p>
        </div>
    </div>

    <div class="col-lg-3 col-md-6">
        <div class="dashboard-card success">
            <i class="bi bi-truck"></i>
            <h4 id="placedOrders">0</h4>
            <p>Pending</p>
        </div>
    </div>

    <div class="col-lg-3 col-md-6">
        <div class="dashboard-card warning">
            <i class="bi bi-check-circle"></i>
            <h4 id="deliveredOrders">0</h4>
            <p>Delivered</p>
        </div>
    </div>

    <div class="col-lg-3 col-md-6">

    <div class="dashboard-card revenue">

    <select id="revenueFilter"
            class="form-select form-select-sm revenue-filter"
            onchange="updateRevenue()">

        <option value="all">All Time</option>
        <option value="today">Today</option>
        <option value="week">This Week</option>
        <option value="month">This Month</option>

    </select>

    <i class="bi bi-currency-rupee revenue-icon"></i>

    <h4 id="totalRevenue">₹0</h4>

    <p id="revenueLabel">
        All Time Revenue
    </p>

</div>

</div>


<!-- SEARCH -->

<div class="search-wrapper mb-4">

    <input
        type="text"
        id="searchOrders"
        class="form-control premium-search"
        placeholder="🔍 Search customer name..."
    >

</div>

<div class="order-filter-bar mb-4">

    <button class="btn btn-success filter-active"
        onclick="filterOrders('ALL')">
    All
</button>

    <button class="btn btn-warning"
            onclick="filterOrders('PLACED')">
        Pending
    </button>

    <button class="btn btn-primary"
            onclick="filterOrders('DELIVERED')">
        Delivered
    </button>

</div>
    <!-- ORDERS -->
    <div id="ordersContainer"
         class="row g-4">

    </div>

</div>

<script src="/js/admin-orders.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
