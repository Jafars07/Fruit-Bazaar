<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fruit Stall</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>

<body>
<div class="video-bg">
    <video autoplay muted loop playsinline>
        <source src="/images/video.mp4" type="video/mp4">
    </video>
</div>
<!-- 🔹 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
       <a class="navbar-brand logo" href="/">
  🥥 <span class="logo-f">F</span>ruit Bazaar 🍓
</a>
</div>
</nav>

<!-- 🔹 AUTH WRAPPER -->
<div class="auth-container">

    <div class="auth-card">

        <div class="auth-header">

    <div class="auth-icon">
        🍎
    </div>
    <div class="login-badge">
    🔐 Secure Login
</div>

    <h3>Welcome Back👋</h3>

</div>

        <form id="loginForm">

            <div class="mb-3">
                <label class="form-label"></label>
               <input
    type="email"
    id="username"
    class="form-control modern-input"
    placeholder="📧 Enter Email Address"
    autocomplete="email"
    required>
            </div>
            
<div class="mb-3">
    <label class="form-label"></label>

    <div class="input-group">
        <input type="password" id="password" class="form-control modern-input" placeholder="🔒 Enter Password" required>

        <span class="input-group-text eye-btn" onclick="togglePassword('password')">
            <i class="bi bi-eye"></i>
        </span>
    </div>
</div>
          <button
    type="submit"
    id="loginBtn"
    class="btn login-btn w-100">

    <span id="loginText">
        🚀 Login
    </span>

</button>

        </form>
        <div id="loginStatus"
     class="text-center mt-3">
</div> 
        <div class="text-center mt-3">
    <a href="/forgot-password" class="text-warning text-decoration-none">
        Forgot Password?
    </a>
</div>
        <p class="text-center mt-3" style="color:white">
            Don't have an account?
            <a href="/register">Register</a>
        </p>

    </div>

</div>

<script src="/js/theme.js"></script>
<script src="/js/login.js"></script>
<script src="/js/toast.js"></script>

</body>
</html>
