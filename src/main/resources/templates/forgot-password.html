<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Fruit Bazaar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/.css">
</head>

<body>

<div class="video-bg">
    <video autoplay muted loop playsinline>
        <source src="/images/video.mp4" type="video/mp4">
    </video>
</div>

<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand logo" href="/">
            🥥 <span class="logo-f">F</span>ruit Bazaar 🍓
        </a>
    </div>
</nav>

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-header">

            <div class="auth-icon">
                🔐
            </div>

            <div class="login-badge">
                Password Recovery
            </div>

            <h3>Forgot Password?</h3>

            <p>
                Verify your email and reset your password
            </p>

        </div>

        <form id="forgotPasswordForm">

            <!-- EMAIL -->

            <div class="mb-3">

                <input
                    type="email"
                    id="username"
                    class="form-control modern-input"
                    placeholder="📧 Enter Email Address"
                    autocomplete="email"
                    required>

            </div>

            <button
                type="button"
                id="sendOtpBtn"
                class="btn btn-warning w-100">

                📩 Send OTP

            </button>

            <!-- OTP SECTION -->

            <div id="otpSection" style="display:none;" class="mt-3">

    <div class="mb-3">
        <input
            type="text"
            id="otp"
            class="form-control modern-input"
            placeholder="🔢 Enter OTP"
            maxlength="4">
    </div>

    <button
        type="button"
        id="verifyOtpBtn"
        class="btn btn-info w-100">

        ✅ Verify OTP

    </button>

</div>

            <!-- PASSWORD SECTION -->

           <div id="passwordSection" style="display:none;" class="mt-3">

    <div class="mb-3">

        <input
        type="password"
        id="newPassword"
        class="form-control modern-input"
        placeholder="🔒 Enter New Password"
        autocomplete="new-password">

    </div>


    <button
    type="button"
    id="resetPasswordBtn"
    class="btn btn-success w-100">

    🔄 Reset Password

    </button>

</div>

        </form>

        <div class="text-center mt-3">

            <a href="/login"
               class="text-warning text-decoration-none">

                ← Back To Login

            </a>

        </div>

    </div>

</div>
<!-- Loading Overlay -->
<div id="loadingOverlay" class="loading-overlay d-none">
    <div class="text-center">
        <div class="spinner-border text-success mb-3"></div>
        <h5 id="loadingText">Please wait...</h5>
    </div>
</div>

<script src="/js/theme.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/forgot-password.js"></script>

</body>
</html>
